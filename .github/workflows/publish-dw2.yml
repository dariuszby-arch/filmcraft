name: Publish FilmCraft 0.20.2-DW2

on:
  push:
    branches: [publish-dw2]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: filmcraft-dw2-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Release verified DW2 Windows and Linux builds with test report
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DW2_COMMIT: 1baed957bd934fb999526a7ffadc2fe14d94b6d8
      DW2_TAG: v0.20.2-DW2
    steps:
      - name: Checkout DW2 release notes and tests
        uses: actions/checkout@v4

      - name: Download successful Windows DW2 workflow artifact
        run: |
          set -euo pipefail
          test "$(gh run view 45145672414 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 45145672414 --json headSha --jq .headSha)" = "$DW2_COMMIT"
          gh run download 45145672414 -n FilmCraft-HEVC-Windows-x64 -D output/windows

      - name: Download successful Linux DW2 workflow artifact
        run: |
          set -euo pipefail
          test "$(gh run view 45145672451 --json conclusion --jq .conclusion)" = success
          test "$(gh run view 45145672451 --json headSha --jq .headSha)" = "$DW2_COMMIT"
          gh run download 45145672451 -n FilmCraft-HEVC-Linux-x86_64 -D output/linux

      - name: Assemble and verify release packages, description and tests
        run: |
          set -euo pipefail
          mkdir -p release
          test -s output/windows/filmcraft.exe
          (cd output/windows && zip -q -r "../../release/FilmCraft-0.20.2-DW2-Windows-x64.zip" .)
          appimage="$(find output/linux -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test -s "$appimage"
          cp -- "$appimage" release/FilmCraft-0.20.2-DW2-Linux-x86_64.AppImage
          tarball="$(find output/linux -type f -name '*.tar.gz' -print -quit)"
          test -n "$tarball"
          test -s "$tarball"
          cp -- "$tarball" release/FilmCraft-0.20.2-DW2-Linux-x86_64.tar.gz
          cp docs/RELEASE_NOTES_0.20.2-DW2_PL.md release/OPIS_WYDANIA_PL.md
          cp docs/WYNIKI_TESTOW_0.20.2-DW2_PL.md release/WYNIKI_TESTOW_PL.md
          (cd release && sha256sum FilmCraft-0.20.2-DW2-* OPIS_WYDANIA_PL.md WYNIKI_TESTOW_PL.md > SHA256SUMS.txt)
          ls -lh release/

      - name: Publish DW2 release from the tested commit
        run: |
          set -euo pipefail
          if gh release view "$DW2_TAG" >/dev/null 2>&1; then
            echo "DW2 release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$DW2_TAG" \
            release/FilmCraft-0.20.2-DW2-Windows-x64.zip \
            release/FilmCraft-0.20.2-DW2-Linux-x86_64.AppImage \
            release/FilmCraft-0.20.2-DW2-Linux-x86_64.tar.gz \
            release/SHA256SUMS.txt \
            release/OPIS_WYDANIA_PL.md \
            release/WYNIKI_TESTOW_PL.md \
            --target "$DW2_COMMIT" \
            --title "FilmCraft 0.20.2-DW2 – HEVC Main 10 SDR" \
            --notes-file docs/RELEASE_NOTES_0.20.2-DW2_PL.md \
            --prerelease --latest=false

      - name: Upload separate copy of DW2 release files
        uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-0.20.2-DW2-release-files
          path: release/
          retention-days: 14
